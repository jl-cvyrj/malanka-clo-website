spring:
  application:
    name: malanka-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:malanka}
    username: ${POSTGRES_USER:malanka}
    password: ${POSTGRES_PASSWORD:malanka}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  cors:
    # Comma-separated list of allowed browser origins for the frontend.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  admin:
    # Optional bootstrap credentials for the very first administrator. Only used when the
    # admin_users table is empty. Never commit real values.
    initial-username: ${APP_ADMIN_INITIAL_USERNAME:}
    initial-password: ${APP_ADMIN_INITIAL_PASSWORD:}
