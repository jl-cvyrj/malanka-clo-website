services:
  postgres:
    image: postgres:18.6
    container_name: malanka-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-malanka}
      POSTGRES_USER: ${POSTGRES_USER:-malanka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-malanka}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-malanka} -d ${POSTGRES_DB:-malanka}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
